name: PPSW missing episodes (manual)

# Restores metadata for episodes that already have releases and downloads only
# the ones with no release yet. Safe to run repeatedly; it never re-downloads.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: podcast-feeds
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, ImageMagick, ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg
          python -m pip install -U "yt-dlp[default]"
          yt-dlp --version

      - name: Write cookies (optional, only if the YT_COOKIES secret exists)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Restore metadata and download only missing PPSW episodes
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FAILURES: "1"
          MAX_NEW: "0"
          SCAN_N: "10000"
          MAX_WORKERS: "2"
          CHECKPOINT_EVERY: "25"
          SHOW_SLUG: ppsw
        run: python scripts/update.py

      - name: Commit feeds and state
        if: always()
        run: |
          bash scripts/push_state.sh "PPSW missing episodes"
