name: Backfill all episodes (one-time)

# Manual dispatch only — deliberately NOT scheduled. Disable this workflow
# immediately after its single successful run.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-all-episodes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slug:
          - ppsw
          - fantasy-folklore
          - star-wars-galaxy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, ImageMagick, ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg
          python -m pip install -U "yt-dlp[default]"
          yt-dlp --version

      - name: Write cookies (optional, only if the YT_COOKIES secret exists)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Backfill every missing episode for ${{ matrix.slug }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_NEW: "0"
          SCAN_N: "10000"
          SHOW_SLUG: ${{ matrix.slug }}
        run: python scripts/update.py

      - name: Commit feeds and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds state seen index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backfill all episodes: ${{ matrix.slug }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            sleep 10
          done
          exit 1
