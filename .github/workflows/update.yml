name: Update feeds

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max new episodes to process per show this run"
        default: "20"

permissions:
  contents: write

concurrency:
  group: podcast-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, ImageMagick, ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg
          python -m pip install -U "yt-dlp[default]"
          yt-dlp --version

      - name: Write cookies (optional, only if the YT_COOKIES secret exists)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Build new episodes + feeds
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_NEW: ${{ github.event.inputs.max_new || '20' }}
        run: python scripts/update.py

      - name: Commit feeds and state
        if: always()
        run: |
          bash scripts/push_state.sh "Update feeds"
