name: Backfill Fantasy Folklore (one-time)

# Runs only after "Backfill PPSW (one-time)" succeeds. Last in the chain.
on:
  workflow_run:
    workflows: ["Backfill PPSW (one-time)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: backfill-fantasy
  cancel-in-progress: false

jobs:
  backfill:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, ImageMagick, ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg
          python -m pip install -U "yt-dlp[default]"
          yt-dlp --version

      - name: Write cookies (optional, only if the YT_COOKIES secret exists)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Backfill every missing Fantasy Folklore episode
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_NEW: "0"
          SCAN_N: "10000"
          SHOW_SLUG: fantasy-folklore
        run: python scripts/update.py

      - name: Commit feeds and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds state seen index.html
          git diff --cached --quiet || (git commit -m "Backfill all episodes: fantasy-folklore" && git push)
