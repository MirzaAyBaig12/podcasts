name: Repair episode dates (one-time)

on:
  workflow_dispatch:
    inputs:
      show:
        description: "Show slug, or all"
        required: false
        default: all
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: podcast-feeds
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install -U "yt-dlp[default]"
          yt-dlp --version

      - name: Write cookies (optional, only if the YT_COOKIES secret exists)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Repair dates from YouTube metadata (no downloads)
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_DATES: "1"
          REPAIR_WORKERS: "4"
          SHOW_SLUG: ${{ inputs.show }}
          SCAN_N: "10000"
        run: python scripts/update.py

      - name: Commit repaired state and feeds
        if: always()
        run: |
          bash scripts/push_state.sh "Repair episode dates from YouTube metadata"

      - name: Disable this one-time workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable repair-dates.yml --repo "$GITHUB_REPOSITORY"
